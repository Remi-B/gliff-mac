name: App checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Parent commit or branch to check (an upstream candidate)
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: app-${{ inputs.ref || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Cheap and always running. Decides whether the expensive jobs below run:
  # they are skipped (which counts as success for required checks) only when
  # docs/ is the sole difference from a commit already validated by a full
  # run. Any failure here leaves full unset, which runs everything.
  scope:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          submodules: false
      - run: python3 -m unittest discover -s tests/ci
      - id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: python3 scripts/ci_scope.py

  rust:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.full != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - run: scripts/bootstrap.sh
      - id: key
        run: echo "key=$(python3 scripts/upstream.py cache-key x86_64-unknown-linux-gnu)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            tools/fixture-gen/target
          key: ${{ steps.key.outputs.key }}
      - run: scripts/check.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gates-linux
          path: build/gates/
          if-no-files-found: ignore

  macos:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.full != 'false' }}
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - run: scripts/bootstrap.sh
      - id: key
        run: echo "key=$(python3 scripts/upstream.py cache-key apple-universal)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            tools/fixture-gen/target
          key: ${{ steps.key.outputs.key }}
      - run: scripts/check.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gates-macos
          path: build/gates/
          if-no-files-found: ignore

  # Upstream's own workspace, lockfile and Arch environment (its CI setup),
  # separate from the app graph: the Linux client/server must keep building
  # at the pinned or candidate SHA.
  upstream-linux:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: |
          pacman -Syu --noconfirm --needed git python rust pkgconf \
            wayland libxkbcommon libdrm mesa gtk4 libadwaita dbus
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - run: git config --global --add safe.directory '*'
      - id: key
        run: echo "key=$(python3 scripts/upstream.py cache-key upstream-linux)-$(sha256sum vendor/gliff/Cargo.lock | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            vendor/gliff/target
          key: ${{ steps.key.outputs.key }}
      - run: python3 scripts/gates.py --only structure,upstream-linux --upstream-linux --summary build/gates/upstream-linux.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gates-upstream-linux
          path: build/gates/
          if-no-files-found: ignore
