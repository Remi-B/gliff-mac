name: Upstream candidate

# Daily: compare the pin with upstream main and, when upstream moved, stage
# exactly that commit on the single candidate branch, run every app gate
# against it and open or refresh one pull request for human review.
# Manual: the same for an explicit full SHA (for example an upstream fix).
# Pull requests touching this automation rehearse it without pushing.
# Never merges: qualification also needs live-host evidence, added by a
# maintainer with scripts/live-host-check.sh.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character upstream commit SHA (empty for upstream main)
        type: string
        required: false
  pull_request:
    paths:
      - .github/workflows/upstream.yml
      - scripts/upstream.py
      - scripts/gates.py
      - tests/compatibility/**

permissions:
  contents: read

concurrency:
  group: upstream-candidate-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  BRANCH: task/upstream-candidate

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.status.outputs.candidate }}
      relation: ${{ steps.status.outputs.relation }}
      action: ${{ steps.dedupe.outputs.action }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
      - id: status
        env:
          SHA: ${{ inputs.sha }}
        run: python3 scripts/upstream.py status --github-output ${SHA:+--sha "$SHA"}
      # One active candidate branch and PR: skip when it already carries this SHA.
      - id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.status.outputs.candidate }}
          UPDATE: ${{ steps.status.outputs.update }}
        run: |
          action=none
          if [[ "$UPDATE" == true ]]; then
            action=update
            body="$(gh pr list --head "$BRANCH" --state open --json body --jq '.[0].body // ""')"
            [[ "$body" == *"$CANDIDATE"* ]] && action=current
          fi
          [[ "${{ github.event_name }}" == pull_request ]] && action=rehearse
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "Candidate $CANDIDATE: $action" >> "$GITHUB_STEP_SUMMARY"

  # Exercise the tooling on the pull request without pushing anything: an
  # exact-SHA rehearsal on the current pin, the focused report from the
  # previous release, and the stale-pin refusal.
  rehearse:
    needs: discover
    if: needs.discover.outputs.action == 'rehearse'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - run: scripts/bootstrap.sh
      - run: |
          pin="$(cat upstream-revision)"
          python3 scripts/upstream.py update "$pin" --report build/upstream/rehearsal.md
          git -C vendor/gliff fetch --quiet --tags origin
          previous="$(git -C vendor/gliff rev-list -n1 v0.4.0)"
          python3 scripts/upstream.py report "$previous" "$pin" --out build/upstream/v0.4.0-to-pin.md
          if python3 scripts/upstream.py update "$previous"; then
            echo "::error::a stale pin was accepted"; exit 1
          fi
          cat build/upstream/v0.4.0-to-pin.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-rehearsal
          path: build/upstream/

  prepare:
    needs: discover
    if: needs.discover.outputs.action == 'update'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - run: scripts/bootstrap.sh
      - env:
          CANDIDATE: ${{ needs.discover.outputs.candidate }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          python3 scripts/upstream.py update "$CANDIDATE" --report build/upstream/report.md
          git commit -m "Update upstream gliff to ${CANDIDATE:0:12}" \
            -m "Candidate staged by the upstream workflow; unqualified until every required gate passes and a maintainer reviews it."
          git push --force origin "$BRANCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-report
          path: build/upstream/report.md

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the
  # candidate runs the app checks here.
  checks:
    needs: [discover, prepare]
    uses: ./.github/workflows/ci.yml
    with:
      ref: task/upstream-candidate

  publish:
    needs: [discover, prepare, checks]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: task/upstream-candidate
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.discover.outputs.candidate }}
        run: |
          shopt -s nullglob
          summaries=(artifacts/gates-*/*.json)
          gates="(no gate summary was produced: the checks did not run)"
          if ((${#summaries[@]})); then
            python3 scripts/upstream.py qualify --gates "${summaries[@]}" --markdown gates.md || true
            gates="$(cat gates.md)"
          fi
          {
            cat artifacts/upstream-report/report.md
            printf '\n## Gate results\n\n%s\n' "$gates"
            printf '\nCandidate `%s`. This PR is never merged automatically.\n' "$CANDIDATE"
          } > body.md
          title="Update upstream gliff to ${CANDIDATE:0:12}"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file body.md
          else
            gh pr create --head "$BRANCH" --base main --title "$title" --body-file body.md
          fi
